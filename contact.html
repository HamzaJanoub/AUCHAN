<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image" href="img/auchan.png">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Auchan | Contact</title>
</head>
<header class="sticky top-0 px-4 bg-white shadow-xs border-b border-gray-200 p-2">
    <div class="flex items-center h-16">
        <a href="index.html">
            <img src="/img/5a1d324c4ac6b00ff574e2bf.png" alt="AUCHAN" class="w-35" />
        </a>
        <div class="ml-auto flex items-center gap-10">
              <nav class="flex items-center gap-6">
                  <a class="font-medium text-gray-500 hover:text-red-600 transition duration-300 text-lg hover:ring p-2 rounded-2xl hover:bg-red-100" href="index.html">Accueil</a>
                  <a class="font-medium text-gray-500 hover:text-red-600 transition duration-300 text-lg hover:ring p-2 rounded-2xl hover:bg-red-100" href="administration.html">Administration</a>
                  <a class="font-medium text-gray-500 hover:text-red-600 transition duration-300 text-lg hover:ring p-2 rounded-2xl hover:bg-red-100" href="contact.html">Contactez-nous</a>
              </nav>
            

    </div>
</div>
</header>
<body class="bg-[url('/img/Auchann.png')] bg-center ">

    

        <section class="my-14 px-4">

            <div class="flex flex-col inset-0  items-center justify-center max-w-5xl mx-auto gap-10  bg-white p-8 rounded-2xl shadow-2xl ">

                <div class="flex flex-col justify-between items-center gap-4 ">
                    <h2 class=" font-bold text-5xl text-red-500  " >Contactez-nous</h2>
                    <p class="flex font-semibold text-2xl text-gray-500 w-auto " >N'hésitez pas à nous contacter pour toute question ou information complémentaire.</p>
                </div>

            <form class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                <div class="flex flex-col gap-5">
                    <label for="input-contact-name" class=" font-bold text-2xl text-red-500 ">Nom</label>
                    <input class="p-2 bg-white rounded-lg border border-gray-200 hover:ring-1 hover:ring-red-400 outline-none transition duration-300" type="text" placeholder="ex: Hamza Janoub" required>

                    <label for="input-contact-name" class="font-bold text-2xl text-red-500 ">Prénom</label>
                    <input class="p-2 bg-white rounded-lg border border-gray-200 hover:ring-1 hover:ring-red-400 outline-none transition duration-300" type="text" placeholder="ex: Hamza Janoub" required>
                    
                    <label for="input-contact-email" class="font-bold text-2xl text-red-500 ">Votre e-mail</label>
                    <input class="p-2 bg-white rounded-lg border border-gray-200 hover:ring-1 hover:ring-red-400 outline-none transition duration-300" type="text" placeholder="ex: youremail@mail.com" required>
                </div>
                <div  class="flex flex-col gap-5 ">
                    <label for="input-contact-phone" class="font-bold text-2xl text-red-500 ">Votre numéro de téléphone</label>
                    <input class="p-2 bg-white rounded-lg border border-gray-200 hover:ring-1 hover:ring-red-400 outline-none transition duration-300" type="number" placeholder="+212 6 XX XX XX XX" required>

                    <label for="input-contact-message" class="font-bold text-2xl text-red-500 ">Votre Message</label>
                    <textarea class="p-2 bg-white rounded-lg border border-gray-200 hover:ring-1 hover:ring-red-400 outline-none transition duration-300" type="text" placeholder="Parlez-nous de vos objectifs .." required></textarea>

                    <div class="flex items-center justify-center gap-1 mt-4">
                        <button class="self-start bg-red-500 text-white px-6 py-3 rounded-xl font-semibold hover:bg-red-600 hover:shadow-lg  transition duration-300">Envoyer le message</button>

                    </div>
                </div>
                </form>
            </div>

        </section>


</body>
</html>
